name: Auto TLS

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: aloestelam-auto-tls
  cancel-in-progress: false

jobs:
  ensure-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if certificate already exists
        id: check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          PORT="${SSH_PORT:-22}"
          if ssh -p "$PORT" "${SSH_USER}@${SSH_HOST}" 'test -f /etc/letsencrypt/live/aloestelam.ir/fullchain.pem'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Certificate already present"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger auto-issue on server
        if: steps.check.outputs.exists != 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          mkdir -p /tmp/aloestelam-deploy-bundle
          cp deploy/nginx/aloestelam.ir.conf /tmp/aloestelam-deploy-bundle/
          cp deploy/systemd/aloestelam.service /tmp/aloestelam-deploy-bundle/
          cp deploy/systemd/aloestelam-cert.service /tmp/aloestelam-deploy-bundle/
          cp deploy/systemd/aloestelam-cert.timer /tmp/aloestelam-deploy-bundle/
          cp deploy/scripts/auto-issue-cert.sh /tmp/aloestelam-deploy-bundle/
          cp deploy/scripts/install-runtime.sh /tmp/aloestelam-deploy-bundle/
          cp deploy/scripts/remote-deploy.sh /tmp/aloestelam-deploy-bundle/
          tar -czf /tmp/aloestelam-deploy-bundle.tgz -C /tmp/aloestelam-deploy-bundle .
          scp -P "$PORT" /tmp/aloestelam-deploy-bundle.tgz "${SSH_USER}@${SSH_HOST}:/tmp/"
          ssh -p "$PORT" "${SSH_USER}@${SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          rm -rf /tmp/aloestelam-deploy
          mkdir -p /tmp/aloestelam-deploy
          tar -xzf /tmp/aloestelam-deploy-bundle.tgz -C /tmp/aloestelam-deploy
          sed -i 's/\r$//' /tmp/aloestelam-deploy/*.sh || true
          chmod +x /tmp/aloestelam-deploy/*.sh
          /tmp/aloestelam-deploy/install-runtime.sh /tmp/aloestelam-deploy
          REMOTE
